name: Android CI

on:
  push:
    # 与仓库实际默认分支对齐：本地开发在 devlop，推送走 devlop:master（见 CONTRIBUTING.md）
    branches: [ master, devlop ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 用 Mock 数据，无需后端即可跑通全链路
      - name: Static analysis (detekt + spotless)
        run: ./gradlew detekt spotlessCheck --stacktrace

      # 文档引用死文件 / 死能力是最常见的腐化方式，这里当成门禁跑（scripts/check-docs.sh）
      - name: Docs consistency
        run: ./scripts/check-docs.sh

      # BOM 会让 @file:Suppress 静默失效，增量构建看不出来，必须显式拦（scripts/check-encoding.sh）
      - name: Encoding check (no BOM)
        run: ./scripts/check-encoding.sh

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :app:testDevDebugUnitTest --stacktrace

      # 覆盖率非回退底线：低于阈值直接失败（阈值配置见根 build.gradle.kts）
      - name: Coverage gate (kover verify)
        run: ./gradlew :core:koverVerify :app:koverVerify --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDevDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDevDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            core/build/reports/detekt/
            app/build/reports/detekt/
          retention-days: 7

  release:
    name: Release build (signed)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      # 签名缺失会直接失败，避免未签名产物被当成正式包
      - name: Verify signing config
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew verifyReleaseSigning

      - name: Assemble prod release
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGN_SECRET: ${{ secrets.SIGN_SECRET }}
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 14
