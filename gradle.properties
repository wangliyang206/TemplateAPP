# Project-wide Gradle settings.
# 编码说明：Windows 上 java 的 stdout 编码跟随控制台代码页（936），
# file.encoding 只管源码/资源读取，管不到日志输出。
# stdout/stderr.encoding 仅在 JDK 19+ 生效；本项目用 JDK 17，因此在 cmd 里
# 中文日志可能显示为乱码（Android Studio / Linux CI 正常）。属平台限制，不影响构建结果。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
# 注意：SmartRefreshLayout 2.1.1 仍直接引用 android.support.v4.view.NestedScrollingParent，
# 关闭 Jetifier 会编译失败。替换为 AndroidX SwipeRefreshLayout 后可改为 false。
# 见 docs/ADR/0004-jetifier.md
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# KSP 增量构建
ksp.incremental=true

# ---------------------------------------------------------------------------
# 模板占位 release 密钥开关
# true  = 允许使用 app/keystore/release.jks（模板自带的占位密钥，指纹见下），
#         仅用于让本模板能直接产出已签名包做演示，会在 verifyReleaseSigning 里告警。
# false = 禁止使用占位密钥。此时若 release 密钥的 SHA-256 仍是占位密钥的指纹，
#         构建会直接失败，防止新项目"复制了模板却忘了换签名"。
#
# ★ 新项目第一件事：把这里改成 false，然后重新生成 release.jks。
# ---------------------------------------------------------------------------
template.usePlaceholderReleaseKey=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
